name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
      # Here, to fail before an hour of tests. v0.2.0 shipped with its API saying 0.1.0. A pre-release of 0.3.0 says 0.3.0.
      - name: Check the API spec has this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          spec=$(sed -n 's/^  version: //p' api/openapi.yaml)
          echo "the spec says $spec"
          [ "$spec" = "${VERSION%%-*}" ]

  # Everything CI does, including all end-to-end suites. Nothing below runs unless it passes.
  test:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # These are the images and files that the test job just tested, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-arm64
          path: package-arm64
      - name: Load images
        run: |
          podman load -q -i images.tar
          podman load -q -i images-arm64.tar
      - name: Check the amd64 images report this version
        # The arm job has checked the arm64 images, as they can't run here.
        run: |
          got=$(podman run --rm --pull=never localhost/nvweaver:dev --version)
          echo "$got"
          [ "$got" = "nvweaverd $VERSION" ]
          got=$(podman run --rm --pull=never localhost/nvweaver:spdk --version)
          [ "$got" = "nvweaverd $VERSION" ]
      - name: Collect the tarballs and their checksums
        run: |
          # A tarball of the wrong architecture would otherwise publish without complaint.
          check() {
            (cd "package-$1" && sha256sum -c SHA256SUMS)
            tar xzf "package-$1/nvweaver-$VERSION-linux-$1.tar.gz" --to-stdout --wildcards '*/nvweaverd' >nvweaverd.check
            file nvweaverd.check | tee /dev/stderr | grep -q "$2"
            file "package-$1/nvweaver-cli-$VERSION-linux-$1" | tee /dev/stderr | grep -q "$2"
          }
          check amd64 x86-64
          check arm64 aarch64
          rm nvweaverd.check
          mkdir build
          mv package-amd64/*.tar.gz package-arm64/*.tar.gz package-amd64/nvweaver-cli-* package-arm64/nvweaver-cli-* build/
      - name: Make the SBOMs
        run: ./.github/make-sboms.sh "$VERSION" amd64 arm64
      - name: Checksum everything
        run: (cd build && sha256sum -- nvweaver-* >SHA256SUMS && cat SHA256SUMS)
      - name: Log in to the registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        # The attestation steps read Docker's credential file, so log in for them there too.
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p ~/.docker
          printf '%s' "$TOKEN" | podman login --authfile ~/.docker/config.json ghcr.io -u "$ACTOR" --password-stdin
      - name: Push the images
        id: push
        run: ./.github/publish-images.sh push >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.kernel }}
          push-to-registry: true
          # Storage records are an organization feature.
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.spdk }}
          push-to-registry: true
          # Storage records are an organization feature.
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/nvweaver-*
          create-storage-record: false
      # Last, so that a failed release leaves latest pointing at the previous good one.
      - name: Move latest
        run: |
          case "$VERSION" in
          *-*) ;; # A pre-release doesn't move latest.
          *) ./.github/publish-images.sh latest ;;
          esac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" build/* --verify-tag --generate-notes "${flags[@]}"
