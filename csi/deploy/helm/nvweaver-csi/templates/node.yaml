{{- $plugin := printf "%s/plugins/%s" .Values.node.kubeletDir .Values.driverName }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nvweaver-csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvweaver-csi
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvweaver-csi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ .Release.Name }}-node
      priorityClassName: {{ .Values.node.priorityClassName }}
      # The kernel makes NVMe/TCP connections, and the node's own network is the one that reaches nvweaver.
      hostNetwork: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "nvweaver-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            {{- include "nvweaver-csi.driverArgs" . | nindent 12 }}
            - --ctrl-loss-tmo={{ .Values.node.ctrlLossTmo }}
            - --reconnect-delay={{ .Values.node.reconnectDelay }}
            - --max-volumes-per-node={{ .Values.node.maxVolumesPerNode }}
          securityContext:
            privileged: true
          {{- with .Values.node.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: plugin, mountPath: /csi}
            - {name: kubelet, mountPath: {{ .Values.node.kubeletDir }}, mountPropagation: Bidirectional}
            - {name: dev, mountPath: /dev}
            - {name: sys, mountPath: /sys}
            - {name: nvme, mountPath: /etc/nvme, readOnly: true}
        - name: registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          args: [--csi-address=/csi/csi.sock, --kubelet-registration-path={{ $plugin }}/csi.sock]
          volumeMounts:
            - {name: plugin, mountPath: /csi}
            - {name: registration, mountPath: /registration}
        - name: liveness
          image: {{ .Values.sidecars.livenessProbe.image }}
          args: [--csi-address=/csi/csi.sock, --http-endpoint=:9899]
          volumeMounts: [{name: plugin, mountPath: /csi}]
      volumes:
        - {name: plugin, hostPath: {path: {{ $plugin }}, type: DirectoryOrCreate}}
        - {name: registration, hostPath: {path: {{ .Values.node.kubeletDir }}/plugins_registry, type: Directory}}
        - {name: kubelet, hostPath: {path: {{ .Values.node.kubeletDir }}, type: Directory}}
        - {name: dev, hostPath: {path: /dev, type: Directory}}
        - {name: sys, hostPath: {path: /sys, type: Directory}}
        - {name: nvme, hostPath: {path: /etc/nvme, type: Directory}}
