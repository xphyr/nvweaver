{{- if not .Values.nvweaver.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nvweaver-csi.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nvweaver-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "nvweaver.url is required, or nvweaver.existingSecret" .Values.nvweaver.url | quote }}
  token: {{ required "nvweaver.token is required, or nvweaver.existingSecret" .Values.nvweaver.token | quote }}
  ca.crt: {{ .Values.nvweaver.ca | quote }}
{{- end }}
