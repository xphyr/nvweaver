apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.driverName }}
  labels: {{- include "nvweaver-csi.labels" . | nindent 4 }}
spec:
  attachRequired: true          # ControllerPublish exports the volume to the node
  podInfoOnMount: false
  fsGroupPolicy: File
  volumeLifecycleModes: [Persistent]
